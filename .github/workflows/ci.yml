name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same image and credentials as docker-compose.yml, so the default
    # TEST_DATABASE_URL in apps/api/test/test-db.ts works unchanged.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: splinance
          POSTGRES_PASSWORD: splinance
          POSTGRES_DB: splinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splinance -d splinance_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        # No cache: this job installs nothing, so there is no pnpm store to save.
        with:
          node-version-file: .nvmrc

      # What ships (dependencies, not devDependencies): a high or critical advisory fails.
      - run: pnpm audit:prod

  data:
    name: Data track (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: data

    steps:
      - uses: actions/checkout@v7

      # Installs uv; uv then fetches the Python version pinned in data/.python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: data
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest

  airflow:
    name: Airflow DAGs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Airflow is not in the local test environment, so DAGs are loaded inside the same image
    # docker-compose runs: import errors, retries, and the ecb_rates regressions.
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t splinance-airflow:ci data

      - run: >-
          docker run --rm
          -v "$PWD/data/dags:/opt/airflow/dags:ro"
          -v "$PWD/data/scripts:/opt/splinance-scripts:ro"
          --entrypoint python splinance-airflow:ci /opt/splinance-scripts/check_dags.py

  infra:
    name: Infrastructure (Terraform)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Formatting and validation only: -backend=false needs no AWS credentials or state.
    # plan and apply run locally (see docs/data-track.md).
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/main init -backend=false -input=false
      - run: terraform -chdir=infra/main validate

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Global setup creates the splinance_e2e database in this server.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: splinance
          POSTGRES_PASSWORD: splinance
          POSTGRES_DB: splinance_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splinance -d splinance_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium only (desktop and Pixel 7 emulation); --with-deps adds the system libraries.
      - run: pnpm --filter @splinance/e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

      # The demo instance: the API with DEMO_MODE, the demo web build, its own database.
      - run: pnpm --filter @splinance/web build:demo && pnpm --filter @splinance/e2e e2e:demo

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
