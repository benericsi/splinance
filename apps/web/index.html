<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Splinance" />
    <title>Splinance</title>
    <!-- Applies the saved theme and language before first paint (no light flash in dark
         mode, the splash in the right language). Mirrors src/lib/theme.ts and
         src/lib/locale.ts (detectLocale). The CSP in deploy/web/Caddyfile allows it by hash:
         change it and update the hash (deploy/scripts/check-csp.mjs prints it). -->
    <script>
      (function () {
        var root = document.documentElement;
        var dark = false;
        var lang = '';
        try {
          var p = localStorage.getItem('splinance-theme');
          dark =
            p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          lang = localStorage.getItem('splinance-locale') || '';
        } catch (e) {
          dark = matchMedia('(prefers-color-scheme: dark)').matches;
        }
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        var tags = navigator.languages || [navigator.language];
        for (var i = 0; lang !== 'en' && lang !== 'hu' && i < tags.length; i++) {
          lang = String(tags[i]).slice(0, 2).toLowerCase();
        }
        root.lang = lang === 'hu' ? 'hu' : 'en';
      })();
    </script>
    <!-- Zod 4 without its JIT: it probes for `new Function` while the app's modules load, and
         the production CSP (no 'unsafe-eval') reports even that caught probe. Zod reads this
         global before creating its config, so it has to exist before any module runs; a
         module calling z.config() would run too late (bundle chunks load first). -->
    <script>
      globalThis.__zod_globalConfig = { jitless: true };
    </script>
    <!-- Splash styles live inline: the app CSS is not loaded yet when the splash shows. -->
    <style>
      html {
        background: oklch(1 0 0);
      }
      html.dark {
        background: oklch(0.145 0 0);
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font:
          14px/1.4 system-ui,
          sans-serif;
        color: oklch(0.556 0 0);
      }
      .splash a {
        color: inherit;
      }
      /* One splash text per language; the script above sets <html lang>. */
      html:lang(hu) .splash [lang='en'],
      html:not(:lang(hu)) .splash [lang='hu'] {
        display: none;
      }
      /* If the app never boots (script error, stale deploy), offer a way out. CSS only. */
      .splash-slow {
        visibility: hidden;
        animation: splash-reveal 0s 8s forwards;
      }
      @keyframes splash-reveal {
        to {
          visibility: visible;
        }
      }
      /* Read by screen readers, not shown (the pulsing logo says it). */
      .splash-label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .splash img {
        width: 40px;
        height: 40px;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        50% {
          opacity: 0.45;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown until main.tsx has restored the session and loaded the first route. -->
      <div class="splash" role="status">
        <img src="/favicon.svg" alt="" />
        <span lang="en" class="splash-label">Loading Splinance</span>
        <span lang="hu" class="splash-label">A Splinance betöltése</span>
        <p class="splash-slow">
          <span lang="en">Taking longer than expected. <a href="">Reload the page</a></span>
          <span lang="hu">A vártnál tovább tart. <a href="">Az oldal újratöltése</a></span>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
