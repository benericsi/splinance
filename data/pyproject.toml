[project]
name = "splinance-data"
version = "0.1.0"
description = "Splinance data track: pipelines from the app, the ECB rates API and bank files into an S3 data lake"
requires-python = ">=3.13,<3.14"
# Lower bounds are what the code needs, not the newest release: inside the Airflow image the
# versions come from Airflow's constraints file (see Dockerfile).
dependencies = [
    "boto3>=1.40",
    "httpx>=0.28",
    # Airflow 3.3.2's constraints pin polars 1.44.2; tests run on the version Airflow runs.
    "polars>=1.44,<2",
    # The Postgres extract (Airflow's constraints pin psycopg 3.3.x).
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
splinance-data = "splinance_data.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.119",
    "botocore[crt]>=1.43.119",
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import order
  "B",   # bugbear: likely bugs
  "UP",  # pyupgrade: modern syntax
  "SIM", # simplifications
  "N",   # naming
  "PT",  # pytest style
  "S",   # bandit: security
  "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "postgres: needs a demo database ($SPLINANCE_TEST_DSN); skipped without it",
]
