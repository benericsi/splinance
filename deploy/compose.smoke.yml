# Both images the way Railway runs them, on one machine: CI job "Images and smoke", or locally
# after building the images (docs/deploy.md). Throwaway secrets; nothing here is for production.
#   docker compose -f deploy/compose.smoke.yml up -d
#   http://localhost:8080 (production build), http://demo.localhost:8080 (demo)

name: splinance-smoke

# The production roles (deploy/db): migrations as the owner, the API as a role without DDL.
x-production: &production
  NODE_ENV: production
  DATABASE_URL: postgres://splinance_app:smoke-app@db:5432/splinance
  MIGRATE_DATABASE_URL: postgres://splinance_owner:smoke-owner@db:5432/splinance
  JWT_ACCESS_SECRET: smoke-only-production-secret-not-for-real-use
  TRUST_PROXY: '1'
  REGISTRATION: allowlist
  REGISTRATION_ALLOWLIST: smoke@example.com

x-demo: &demo
  NODE_ENV: production
  DATABASE_URL: postgres://splinance_demo_app:smoke-demo-app@db:5432/splinance_demo
  MIGRATE_DATABASE_URL: postgres://splinance_demo_owner:smoke-demo-owner@db:5432/splinance_demo
  JWT_ACCESS_SECRET: smoke-only-demo-secret-different-from-production
  TRUST_PROXY: '1'
  DEMO_MODE: 'true'

services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    # Like Railway's template: superuser postgres, nothing else yet. With any other user the
    # image would create a database of that name (splinance), and prod.sql would find it taken.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smoke-superuser
      POSTGRES_DB: postgres
    volumes:
      # Railway has two servers; here both setups share one (their role names differ).
      - ./db:/deploy-db:ro
      - ./db/smoke-init.sh:/docker-entrypoint-initdb.d/smoke-init.sh:ro
    healthcheck:
      # Over TCP: the init scripts run on a socket-only server, so this passes only once they
      # are done and the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d splinance_demo']
      interval: 2s
      retries: 60

  # Railway runs these as the pre-deploy command of each API service.
  migrate:
    image: splinance-api:smoke
    command: ['node', 'dist/migrate.mjs']
    environment: *production
    depends_on:
      db:
        condition: service_healthy

  # After the production one, never beside it: on a fresh server both would create the
  # analytics reader role at once, and the second CREATE ROLE fails (unique_violation).
  migrate-demo:
    image: splinance-api:smoke
    command: ['node', 'dist/migrate.mjs']
    environment: *demo
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: splinance-api:smoke
    environment: *production
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-demo:
    image: splinance-api:smoke
    environment: *demo
    depends_on:
      migrate-demo:
        condition: service_completed_successfully

  web:
    image: splinance-web:smoke
    environment:
      PORT: '8080'
      DOMAIN: localhost
      API_UPSTREAM: api:3000
      API_DEMO_UPSTREAM: api-demo:3000
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
      api-demo:
        condition: service_healthy
